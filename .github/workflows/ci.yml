name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # The coordinator contract and the two-replica cluster suite run against a
    # real Redis when one is named, and skip otherwise. Named here, so a skip
    # on a developer's machine is never a skip in CI — a check that skips and a
    # check that passes are the same green.
    services:
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The store contract suite runs every repo test twice, SQLite and
      # Postgres, when this is named; same rule as Redis above.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      OMNI_TEST_REDIS_URL: redis://127.0.0.1:6379
      OMNI_TEST_DATABASE_URL: postgres://postgres:omni@127.0.0.1:5432/omni

    steps:
      # Full history and tags, not the default depth-1 tagless checkout.
      # Three checks compare against `main` or the newest `v*` tag:
      # `check:claims`, `check:dead`, and the publish-drift guard inside
      # `publishable.test.ts`. At the default depth the first two crash with an
      # uncaught `git merge-base` failure and the third silently returns —
      # and a check that skips and a check that passes are the same green,
      # which is precisely how the drift it guards against shipped.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # Exact version, not `canary` and not `latest`. `bun.lock` is
      # lockfileVersion 2, which needs Bun 1.4 — 1.3.x silently *downgrades*
      # the lockfile rather than failing, so a wrong pin corrupts rather than
      # errors. 1.4.0 went stable 2026-08-20 and reads it: verified by running
      # `bun install --frozen-lockfile` against this lockfile on 1.4.0 and
      # confirming the file was byte-identical afterwards.
      #
      # `canary` was a moving target no commit recorded — a run could not be
      # reproduced, and a canary regression surfaced as a test failure in
      # whatever branch happened to run next.
      #
      # Bump deliberately, together with `release.yml`, which must stay on the
      # same version as CI or releases are built by a toolchain nothing tested.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      # `pipefail` first, and it is the whole reason this is a `bash -c` block
      # rather than a one-liner. A pipeline reports the exit status of its LAST
      # command, so `bun test | tee` exits 0 whenever `tee` succeeds — which is
      # always. Without this line every failing test run would report green,
      # and the logging added to catch flakes would instead hide every failure.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          bun run test:all 2>&1 | tee test.log

      # Only on failure, and it is the one thing the job log does not give you.
      # A full run prints ~25k assertion lines, so the handful of `(fail)` lines
      # are somewhere in the middle of a page nobody scrolls. This pulls them
      # and the lines above each one — which is where the diff and the stack
      # are — into the run summary, so a flake is named the first time it fires
      # rather than the second time somebody goes looking for it.
      - name: Name the failures
        if: failure()
        shell: bash
        run: |
          # Captured to a variable first. Written as `grep ... || echo`, the
          # `||` binds to the last command of the pipeline rather than to grep,
          # so a run that died before reporting any `(fail)` line would print an
          # empty code block and no explanation — the summary would look like
          # "nothing failed" for the case where everything did.
          failures="$(grep -B 20 '^(fail)' test.log | tail -c 60000)"
          {
            echo '## Failing tests'
            echo
            echo '```'
            if [ -n "$failures" ]; then
              printf '%s\n' "$failures"
            else
              echo 'No "(fail)" lines. The run died before the suite reported;'
              echo 'read the end of the job log or the uploaded test.log artifact.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The artifact rather than the log alone: job logs are retention-bound and
      # truncated at 4 MB, and a flake is worth grepping offline against a
      # re-run of the same commit.
      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: test.log
          retention-days: 14

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Separate steps rather than folded into `lint`, so a failure names which
      # question was answered wrong. Both read git history, which is why the
      # checkout above is not the default one.
      #
      # They were `package.json` scripts nothing invoked for two commits —
      # present, documented, green when run by hand, and gating nothing. A check
      # that reads as coverage without being it is worse than no check, because
      # it is the one nobody thinks to add.
      - name: Stale claims
        run: bun run check:claims

      - name: Dead exports
        run: bun run check:dead
