name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # `bun.lock` uses lockfileVersion 2, which currently requires Bun 1.4 canary.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test:all

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint
