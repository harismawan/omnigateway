name: release

# The tag is both the trigger and the version. Nothing in the repo records a
# release number — the workspace manifests stay at 0.0.0 and private — so there
# is no second place to bump and nothing to drift out of step.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # The whole of the publishing credential: npm exchanges this OIDC token for a
  # short-lived one, having been told on npmjs.com to trust this workflow in
  # this repository. There is no secret to leak, rotate, or forget.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Canary, deliberately: `bun.lock` is lockfileVersion 2, which only Bun
      # 1.4 writes and reads, and 1.4 is unreleased. A released pin cannot
      # install this lockfile, and asking for "1.4.0" 404s — both were tried on
      # this tag. CI therefore tracks the same Bun the repository is developed
      # on. If a canary ever breaks a release, pin the exact build here rather
      # than rewriting the lockfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      # Everything below the publish step is unrecoverable — a bad version
      # cannot be unpublished after 72 hours — so the whole suite runs first.
      - name: Test
        run: bun run test:all

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build the dashboard
        run: bun run build:dashboard

      - name: Build the package
        run: bun run build:npm "${GITHUB_REF_NAME}"

      # npm, not bun, does the publishing: the OIDC exchange is an npm CLI
      # feature.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships an npm older than 11.5.1, the floor for trusted publishing.
      - run: npm install -g npm@latest

      # No token and no `--provenance`: trusted publishing supplies the
      # credential from the OIDC token above, and attaches the provenance
      # attestation itself.
      - name: Publish
        run: npm publish --access public
        working-directory: dist/npm
