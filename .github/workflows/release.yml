name: release

# The tag is both the trigger and the version. Nothing in the repo records a
# release number — the workspace manifests stay at 0.0.0 and private — so there
# is no second place to bump and nothing to drift out of step.
on:
  push:
    tags:
      - "v*"

permissions:
  # Write, not read, for two reasons: the publish job cuts the GitHub release,
  # and the promote job commits the new image tag to `main`. Neither buys
  # anything towards npm, which authenticates through OIDC below.
  contents: write
  # The image job pushes to ghcr.io.
  packages: write
  # The whole of the publishing credential: npm exchanges this OIDC token for a
  # short-lived one, having been told on npmjs.com to trust this workflow in
  # this repository. There is no secret to leak, rotate, or forget.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Exact version. `bun.lock` is lockfileVersion 2, which needs Bun 1.4;
      # this previously tracked `canary` because 1.4 was unreleased and a 1.3.x
      # pin silently downgrades the lockfile instead of failing. 1.4.0 went
      # stable 2026-08-20, so the reason for `canary` is gone: a release built
      # by "whatever Bun existed at tag time" is not reproducible from the tag.
      #
      # Must stay on the same version as `ci.yml`. Bump both together, or
      # releases ship from a toolchain the test suite never ran on.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      # Everything below the publish step is unrecoverable — a bad version
      # cannot be unpublished after 72 hours — so the whole suite runs first.
      - name: Test
        run: bun run test:all

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build the dashboard
        run: bun run build:dashboard

      - name: Build the package
        run: bun run build:npm "${GITHUB_REF_NAME}"

      # npm, not bun, does the publishing: the OIDC exchange is an npm CLI
      # feature.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships an npm older than 11.5.1, the floor for trusted publishing.
      - run: npm install -g npm@latest

      # The two SDK packages a plugin author installs. Unlike the gateway they
      # carry their own versions, and those versions are not this tag: they are
      # `PLUGIN_API_VERSION` and `DASHBOARD_SDK_VERSION`, the numbers the host
      # actually enforces a manifest against. Tying them to the gateway's tag
      # would republish an identical contract on every patch release and make
      # the `sdk` ranges in every manifest mean nothing.
      #
      # The consequence is that most releases publish neither, so an unchanged
      # version is skipped rather than failing the run. `npm view` is the check;
      # a registry lookup that errors for any other reason leaves the version
      # unset and the publish is attempted, which fails loudly rather than
      # silently skipping.
      #
      # Order matters: the SDK depends on the API, so the API goes first.
      #
      # A package that does not exist on npm cannot be published from here, and
      # that is npm's limitation rather than this workflow's. Trusted publishing
      # is configured on a package's settings page, and there is no settings page
      # until a version exists — npm has no pre-registration the way PyPI does
      # (npm/cli#8544). So each new package name has to be created once with a
      # token before OIDC can ever work for it, and until that is done this step
      # fails with a permissions error that does not explain itself.
      #
      # Both current names were bootstrapped by publishing an empty `0.0.1` under
      # `--tag bootstrap`, so it never became `latest`, and the real versions ship
      # from here with provenance. Do the same for a third.
      - name: Publish the plugin SDKs
        run: |
          set -euo pipefail
          for dir in packages/plugin-api packages/dashboard-sdk; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is already published; skipping"
            else
              echo "publishing $name@$version"
              cp LICENSE "$dir/LICENSE"
              (cd "$dir" && npm publish --access public)
            fi
          done

      # The gateway goes last of the three, and the order is a risk decision
      # rather than a preference. Every publish here is irreversible — npm allows
      # unpublishing for 72 hours and not after — so when two of them must both
      # happen, the one most likely to fail belongs first, where failing costs
      # nothing but a re-tag.
      #
      # This step is the proven one: it has published every gateway version since
      # v0.2.2 through the same OIDC exchange. The SDK step above is the unproven
      # one, on package names whose trusted-publishing policies were configured by
      # hand and cannot be verified from here — no API exposes them, so the first
      # release is the test. Publishing the gateway first would mean discovering a
      # bad policy with the gateway already on npm, the tag consumed, and a
      # half-published release to explain.
      #
      # No token and no `--provenance`: trusted publishing supplies the credential
      # from the OIDC token above, and attaches the provenance attestation itself.
      - name: Publish
        run: npm publish --access public
        working-directory: dist/npm

      # After the publish, never before. A release created first would announce
      # a version that a failing publish then never puts on npm, and the fix
      # would be deleting a release people may already have seen. This way the
      # worst case is a published version with no release, which is the state
      # every tag before v0.2.2 is already in and is repaired by one command.
      #
      # `--verify-tag` refuses to invent a release for a tag that does not
      # exist, so a hand-run of this step cannot conjure one.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  # The container image, tagged with the version the tag names. Built after the
  # npm publish for the same reason the release is: an image is what Argo CD
  # deploys, and a tag whose npm publish failed should not also be running.
  image:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omnigateway:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/omnigateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps promotion: the kustomize base on `main` names the image tag, and
  # Argo CD watches `main`. Moving `newTag` is the deploy; nothing here talks
  # to a cluster.
  #
  # A pull request rather than a push. `main` requires one, and GitHub does not
  # let a user-owned repository grant the Actions app a bypass — that is an
  # organisation feature — so the bot does what a person does: branch, commit,
  # open, merge. Zero approvals are required and no checks are, so the merge
  # goes through on the same token. `pull-requests: write` is for the open.
  promote:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Point the kustomize base at the new image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="gitops/promote-${VERSION}"
          sed -i "s/newTag: .*/newTag: ${VERSION}/" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "kustomization already at ${VERSION}"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "chore(gitops): promote omnigateway image to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(gitops): promote omnigateway image to ${VERSION}" \
            --body "Points \`k8s/kustomization.yaml\` at \`ghcr.io/harismawan/omnigateway:${VERSION}\`. Argo CD deploys on merge."
          gh pr merge "$BRANCH" --squash --delete-branch
