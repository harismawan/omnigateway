name: release

# The tag is both the trigger and the version. Nothing in the repo records a
# release number — the workspace manifests stay at 0.0.0 and private — so there
# is no second place to bump and nothing to drift out of step.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  rust-binaries:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            platform: ""
          - target: aarch64-apple-darwin
            runner: macos-15
            platform: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/dashboard build:production
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: runner.os == 'Linux'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: runner.os == 'Linux'
        with:
          path: /tmp/rust-build-cache
          key: rust-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Dockerfile', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Dockerfile', 'rust-toolchain.toml') }}-
      - name: Build static Linux binary
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          docker buildx build --platform "$PLATFORM" --target binary
          --build-arg "OMNI_VERSION=${GITHUB_REF_NAME#v}"
          --cache-from type=local,src=/tmp/rust-build-cache
          --cache-to type=local,dest=/tmp/rust-build-cache-new,mode=max
          --output type=local,dest=release-bin .
      - name: Verify Linux architecture and static linkage
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          file release-bin/omnigateway
          # Capture first so a readelf failure cannot pass a negated grep.
          readelf -h release-bin/omnigateway > elf-header.txt
          readelf -l release-bin/omnigateway > elf-program.txt
          readelf -d release-bin/omnigateway > elf-dynamic.txt
          case "$TARGET" in
            x86_64-unknown-linux-musl) machine='Advanced Micro Devices X86-64' ;;
            aarch64-unknown-linux-musl) machine='AArch64' ;;
            *) exit 1 ;;
          esac
          grep -Eq "Machine:[[:space:]]+$machine[[:space:]]*$" elf-header.txt
          if grep -Eq 'INTERP|Requesting program interpreter' elf-program.txt; then exit 1; fi
          if grep -q '(NEEDED)' elf-dynamic.txt; then exit 1; fi
      - name: Rotate Linux build cache
        if: runner.os == 'Linux'
        run: |
          rm -rf /tmp/rust-build-cache
          mv /tmp/rust-build-cache-new /tmp/rust-build-cache
      - name: Install pinned Rust toolchain
        if: runner.os == 'macOS'
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.os == 'macOS'
      - name: Build macOS binary
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          OMNI_CLI_VERSION="${GITHUB_REF_NAME#v}" cargo build --locked --release --target "$TARGET" -p omni-gateway --bin omnigateway
          mkdir -p release-bin
          cp "target/$TARGET/release/omnigateway" release-bin/
      - name: Package binary and dashboard
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cp -R apps/dashboard/dist release-bin/public
          cp LICENSE release-bin/
          ln -s omnigateway release-bin/omni
          # The workspace release profile strips symbols on every target.
          ./release-bin/omni --help
          test "$(./release-bin/omni --version)" = "${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          tar -czf "release-assets/omnigateway-${GITHUB_REF_NAME}-${TARGET}.tar.gz" -C release-bin .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  rust-assets:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [publish, rust-binaries]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rust-*
          merge-multiple: true
          path: release-assets
      - name: Checksum and attach assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS

  publish:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    needs: rust-binaries

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Exact version. `bun.lock` is lockfileVersion 2, which needs Bun 1.4;
      # this previously tracked `canary` because 1.4 was unreleased and a 1.3.x
      # pin silently downgrades the lockfile instead of failing. 1.4.0 went
      # stable 2026-08-20, so the reason for `canary` is gone: a release built
      # by "whatever Bun existed at tag time" is not reproducible from the tag.
      #
      # Must stay on the same version as `ci.yml`. Bump both together, or
      # releases ship from a toolchain the test suite never ran on.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # Everything below the publish step is unrecoverable — a bad version
      # cannot be unpublished after 72 hours — so the whole suite runs first.
      - name: Test
        run: bun run test:all

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The npm packages carry the release archives' bytes, not a rebuild:
      # the four platform packages are unpacked from the same artifacts that
      # `rust-assets` attaches to the GitHub release.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rust-*
          merge-multiple: true
          path: release-assets

      - name: Build the packages
        run: bun run build:npm "${GITHUB_REF_NAME}" release-assets

      # The linux-x64 package must run here exactly as npm will install it.
      - name: Check the linux-x64 package
        run: test "$(dist/npm/linux-x64/omnigateway omni --version)" = "${GITHUB_REF_NAME#v}"

      # npm, not bun, does the publishing: the OIDC exchange is an npm CLI
      # feature.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships an npm older than 11.5.1, the floor for trusted publishing.
      - run: npm install -g npm@latest

      # The two SDK packages a plugin author installs. Unlike the gateway they
      # carry their own versions, and those versions are not this tag: they are
      # `PLUGIN_API_VERSION` and `DASHBOARD_SDK_VERSION`, the numbers the host
      # actually enforces a manifest against. Tying them to the gateway's tag
      # would republish an identical contract on every patch release and make
      # the `sdk` ranges in every manifest mean nothing.
      #
      # The consequence is that most releases publish neither, so an unchanged
      # version is skipped rather than failing the run. `npm view` is the check;
      # a registry lookup that errors for any other reason leaves the version
      # unset and the publish is attempted, which fails loudly rather than
      # silently skipping.
      #
      # Order matters: the SDK depends on the API, so the API goes first.
      #
      # A package that does not exist on npm cannot be published from here, and
      # that is npm's limitation rather than this workflow's. Trusted publishing
      # is configured on a package's settings page, and there is no settings page
      # until a version exists — npm has no pre-registration the way PyPI does
      # (npm/cli#8544). So each new package name has to be created once with a
      # token before OIDC can ever work for it, and until that is done this step
      # fails with a permissions error that does not explain itself.
      #
      # Both current names were bootstrapped by publishing an empty `0.0.1` under
      # `--tag bootstrap`, so it never became `latest`, and the real versions ship
      # from here with provenance. Do the same for a third.
      - name: Publish the plugin SDKs
        run: |
          set -euo pipefail
          for dir in packages/plugin-api packages/dashboard-sdk; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is already published; skipping"
            else
              echo "publishing $name@$version"
              cp LICENSE "$dir/LICENSE"
              (cd "$dir" && npm publish --access public)
            fi
          done

      # The gateway goes last, and the order is a risk decision rather than a
      # preference. Every publish here is irreversible — npm allows unpublishing
      # for 72 hours and not after — so when several must all happen, the ones
      # most likely to fail belong first, where failing costs nothing but a
      # re-run. The SDK step above and the four platform names are the unproven
      # ones: their trusted-publishing policies were configured by hand and no
      # API exposes them. `omnigateway` itself has published every version since
      # v0.2.2 through the same OIDC exchange.
      #
      # No token and no `--provenance`: trusted publishing supplies the credential
      # from the OIDC token above, and attaches the provenance attestation itself.
      #
      # Platform packages first, the main `omnigateway` last: until the main
      # package is on `latest`, `npm update -g omnigateway` keeps resolving the
      # previous release, so a failure part-way strands nobody. An already
      # published platform version is skipped, so a re-run after a failed main
      # publish completes rather than erroring.
      #
      # The four `@omnigateway/<os>-<cpu>` names must each be bootstrapped once
      # (`0.0.1` under `--tag bootstrap`) with trusted publishing configured,
      # exactly as the SDK names above were.
      - name: Publish
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/packed
          for dir in linux-x64 linux-arm64 darwin-x64 darwin-arm64 omnigateway; do
            npm pack --silent --pack-destination dist/packed "dist/npm/$dir" > /dev/null
          done
          # Every platform tarball holds the release archive's binary, byte for byte.
          bun scripts/build-npm.ts --verify-packed "$GITHUB_REF_NAME" release-assets dist/packed/*.tgz
          for dir in linux-x64 linux-arm64 darwin-x64 darwin-arm64 omnigateway; do
            name=$(node -p "require('./dist/npm/$dir/package.json').name")
            tarball=dist/packed/$(node -p "require('./dist/npm/$dir/package.json').name.replace('@','').replace('/','-')")-$version.tgz
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
            published=$(npm view "$name@$version" dist.integrity 2>/dev/null || true)
            if [ -z "$published" ]; then
              (cd "dist/npm/$dir" && npm publish --access public)
            elif [ "$published" = "$local_integrity" ]; then
              echo "$name@$version is already published with these exact bytes; skipping"
            else
              # A rerun must never point `latest` at different bytes.
              echo "$name@$version is already on npm with different contents ($published); refusing" >&2
              exit 1
            fi
          done

      # After the publish, never before. A release created first would announce
      # a version that a failing publish then never puts on npm, and the fix
      # would be deleting a release people may already have seen. This way the
      # worst case is a published version with no release, which is the state
      # every tag before v0.2.2 is already in and is repaired by one command.
      #
      # `--verify-tag` refuses to invent a release for a tag that does not
      # exist, so a hand-run of this step cannot conjure one.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The first Rust major carries its upgrade notice above the
          # generated changelog; other releases get the changelog alone.
          notes=()
          if [ "${GITHUB_REF_NAME}" = "v1.0.0" ]; then
            sed -n '/^```text$/,/^```$/p' docs/rust-npm-final-notice.md | sed '1d;$d' > release-notice.md
            test -s release-notice.md
            notes=(--notes "$(cat release-notice.md)")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes "${notes[@]}" \
            --verify-tag

  # The container image, tagged with the version the tag names. Built after the
  # npm publish for the same reason the release is: an image is what Argo CD
  # deploys, and a tag whose npm publish failed should not also be running.
  image:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: rust-assets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: OMNI_VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/omnigateway:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/omnigateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps promotion: the kustomize base on `main` names the image tag, and
  # Argo CD watches `main`. Moving `newTag` is the deploy; nothing here talks
  # to a cluster.
  #
  # A pull request rather than a push. `main` requires one, and GitHub does not
  # let a user-owned repository grant the Actions app a bypass — that is an
  # organisation feature — so the bot does what a person does: branch, commit,
  # open, merge. Zero approvals are required and no checks are, so the merge
  # goes through on the same token. `pull-requests: write` is for the open.
  promote:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Point the kustomize base at the new image
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_RUST_RELEASE: ${{ vars.FIRST_RUST_RELEASE }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="gitops/promote-${VERSION}"
          sed -i "s/newTag: .*/newTag: ${VERSION}/" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "kustomization already at ${VERSION}"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "chore(gitops): promote omnigateway image to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(gitops): promote omnigateway image to ${VERSION}" \
            --body "Points \`k8s/kustomization.yaml\` at \`ghcr.io/harismawan/omnigateway:${VERSION}\`. Argo CD deploys on merge."
          # Set the repository variable FIRST_RUST_RELEASE=true before the
          # cutover tag. The operator adds Recreate and merges this PR by hand.
          if [ "$FIRST_RUST_RELEASE" != "true" ]; then
            gh pr merge "$BRANCH" --squash --delete-branch
          fi
