name: release

# The tag is both the trigger and the version. Nothing in the repo records a
# release number — the workspace manifests stay at 0.0.0 and private — so there
# is no second place to bump and nothing to drift out of step.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm provenance, and for the OIDC exchange that replaces the
  # token once `omnigateway` exists on npm and can be configured there.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      # Everything below the publish step is unrecoverable — a bad version
      # cannot be unpublished after 72 hours — so the whole suite runs first.
      - name: Test
        run: bun test

      - name: Test the dashboard
        run: bun run --cwd apps/dashboard test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build the dashboard
        run: bun run build:dashboard

      - name: Build the package
        run: bun run build:npm "${GITHUB_REF_NAME}"

      # npm, not bun, does the publishing: provenance and the OIDC exchange are
      # npm CLI features.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships an npm older than 11.5.1, which is the floor for both
      # provenance and the trusted-publishing exchange this will move to.
      - run: npm install -g npm@latest

      # A token, only until the package exists. Once it does, configure a
      # trusted publisher for it on npmjs.com, then delete the `env:` block
      # below and the NPM_TOKEN secret: OIDC needs neither, and generates the
      # provenance attestation on its own.
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
