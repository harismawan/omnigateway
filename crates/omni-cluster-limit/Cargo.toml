[package]
name = "omni-cluster-limit"
description = "Cluster rate limiting on Redis/Valkey: the combined admission script, batched debits, background seeding, fail-open local limiting, and load publication."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
omni-coord = { path = "../omni-coord" }
omni-ratelimit = { path = "../omni-ratelimit" }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
# Same exact pin as omni-coord (its `Remote` takes and returns these types).
redis = { version = "=1.4.0", default-features = false, features = ["tokio-comp", "script"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
omni-ir = { path = "../omni-ir" }
# The seed/debit visibility contract against a real PostgreSQL
# (`tests/postgres.rs`); already in the workspace via omni-store.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
