[package]
name = "omni-coord"
description = "Coordination between the gateway processes of one installation: the in-process coordinator and the Redis/Valkey one, on the TS key schema."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
omni-ratelimit = { path = "../omni-ratelimit" }
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
# Pinned exactly: `redis::link::Handoff` relies on how this version sends
# (one poll puts a request in the connection channel). Re-check on upgrade.
redis = { version = "=1.4.0", default-features = false, features = ["tokio-comp", "script"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
sha2 = "0.10"
