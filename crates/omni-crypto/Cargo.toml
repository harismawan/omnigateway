[package]
name = "omni-crypto"
description = "Byte-exact crypto and hashing contracts shared with the TS build."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
aes-gcm = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
md-5 = "0.11"
base64 = "0.22"
rand = "0.10"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
# Console passwords: argon2id PHC strings, as `Bun.password` writes them.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }

[dev-dependencies]
serde_json.workspace = true
