[package]
name = "omni-ir"
description = "Provider-neutral model and JS-compatible JSON serialization."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ryu-js = "1.0.3"
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
# Stack growth for the deep-JSON paths (`deep.rs`). Both hold their `unsafe`
# internally; this crate stays `forbid(unsafe_code)`.
serde_stacker = "0.1"
stacker = "0.1"

[dev-dependencies]
serde.workspace = true
