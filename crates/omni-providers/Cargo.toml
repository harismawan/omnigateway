[package]
name = "omni-providers"
description = "Provider codecs, the SSE parser and the order-preserving outbound HTTP client."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
omni-ir = { path = "../omni-ir" }
omni-crypto = { path = "../omni-crypto" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros"] }
bytes = "1"
httparse = "1.10"
memchr = "2"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
sha2 = "0.11"
zstd = { version = "=0.14.4", default-features = false }
rand = "0.10"
# Qoder's Cosy-Key wrapping: randomized RSA PKCS#1 v1.5. `getrandom` backs
# `rsa::rand_core::OsRng` (rsa 0.9 pins rand_core 0.6, not the workspace rand).
rsa = { version = "0.9", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
omni-dialects = { path = "../omni-dialects" }
serde.workspace = true
# The deep-schema vectors nest past serde_json's default 128-level limit.
serde_json = { workspace = true, features = ["unbounded_depth"] }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros", "test-util"] }
rcgen = "0.14"
# Qoder protocol vectors: independent MD5 of the signed fields, and the
# AES-128-CBC decrypt half of the RSA key-wrap round-trip.
md-5 = "0.11"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.11"
