[package]
name = "omni-store"
description = "SQLite and Postgres stores: migrations shared with the TS build, and the snapshot reads the gateway serves from."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
omni-crypto = { path = "../omni-crypto" }
omni-ir = { path = "../omni-ir" }
omni-ratelimit = { path = "../omni-ratelimit" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "limits"] }
indexmap = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
# Postgres: tokio-postgres for typed array binds (`unnest`), deadpool for a
# bounded pool with wait/create timeouts. No TLS connector yet (see d1 report).
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
# Body-artifact envelope (shared with omni-crypto's field key).
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.9"
flate2 = "1"

[dev-dependencies]
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "limits", "trace"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
