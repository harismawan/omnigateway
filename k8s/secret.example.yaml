apiVersion: v1
kind: Secret
metadata:
  name: omnigateway-secrets
type: Opaque
stringData:
  # CHANGE THESE VALUES BEFORE APPLYING

  # The same on every replica, forever: it encrypts provider credentials at
  # rest, and changing it makes every stored credential unreadable.
  # `openssl rand -base64 32`
  OMNI_ENCRYPTION_KEY: "change-this-to-a-secure-random-string"

  # Required by OMNI_CLUSTER_MODE=true in the ConfigMap. Total connections =
  # replicas * pool; keep it under the server's max_connections.
  OMNI_DATABASE_URL: "postgres://omni:password@postgresql:5432/omni"

  # The coordinator every replica shares: rate-limit counters, sessions,
  # leases, push fan-out. Include the password if the server requires auth.
  OMNI_REDIS_URL: "redis://:password@redis:6379"
